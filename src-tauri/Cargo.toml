[package]
name = "myexplorer"
version = "1.1.0"
description = "MyExplorer - fast Windows file explorer"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "myexplorer-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
memchr = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
png = "0.17"
lru = "0.12"
tokio = { version = "1", features = ["sync"] }
windows-core = "0.62"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ignore = "0.4.30"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
]

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
